# Pages CMS — the editor Matt uses at https://app.pagescms.org
#
# Four screens. "Hero" edits site/content/hero.json: the name, intro
# and button words at the top of the page. "Work" edits
# site/content/work.json: the showreel link, the ticker words, and each
# section's cards. "About" edits site/content/about.json. "Terms of
# service" edits site/content/terms.json, the /terms/ page.
#
# The privacy policy is deliberately NOT here. It describes what the
# site's code collects and where it sends it, so it changes with the
# code, in site/app/privacy/page.tsx. Saving commits to main,
# and Cloudflare rebuilds the site from that commit (~1–2 min).
#
# Images (thumbnails and the headshot) upload to site/public/work/
# and are served from /work/.
# Thumbnails: a 16:9 still, 1280×720 JPG, under ~200 KB.
#
# If a save leaves something the page can't show, the build stops and
# the last good version stays live. See
# site/content/work.ts and site/content/about.ts for what they check.

media:
  input: site/public/work
  output: /work
  extensions: [jpg, jpeg, png, webp]

content:
  - name: hero
    label: Hero
    description: The words at the top of the home page, beside the showreel.
    type: file
    path: site/content/hero.json
    format: json
    fields:
      - name: name
        label: Name
        description: The big first line. Up to 24 characters.
        type: string
        required: true
        pattern:
          regex: '^.{1,24}$'
          message: Keep it to 24 characters so it fits on a phone.
      - name: line2
        label: Second line
        description: The orange line under the name, e.g. Video & Animation. Up to 32 characters.
        type: string
        required: true
        pattern:
          regex: '^.{1,32}$'
          message: Keep it to 32 characters so it fits on a phone.
      - name: intro
        label: Intro sentence
        description: One sentence on what you make and who for. Up to 220 characters.
        type: text
        required: true
        pattern:
          regex: '^[\s\S]{1,220}$'
          message: Keep it to 220 characters.
      - name: primaryButton
        label: Orange button
        description: Jumps to the project form, e.g. Start a project. Up to 24 characters.
        type: string
        required: true
        pattern:
          regex: '^.{1,24}$'
          message: Keep it to 24 characters.
      - name: secondaryButton
        label: Outline button
        description: Jumps to the video cards, e.g. See the work. Up to 24 characters.
        type: string
        required: true
        pattern:
          regex: '^.{1,24}$'
          message: Keep it to 24 characters.

  - name: work
    label: Work
    description: The showreel, the scrolling words, and every video card on the home page.
    type: file
    path: site/content/work.json
    format: json
    fields:
      - name: showreel
        label: Showreel
        type: object
        fields:
          - name: vimeo
            label: Vimeo link
            description: "Vimeo → Share → Copy link. Unlisted links end in a code like /63dcf087a9 — keep it."
            type: string
            pattern:
              regex: '^(https://vimeo\.com/\d+(/[a-f0-9]+)?(\?.*)?)?$'
              message: Paste the link from Vimeo's Share button, e.g. https://vimeo.com/123456789/abc123def4
          - name: runtime
            label: Runtime
            description: Minutes:seconds, e.g. 0:59
            type: string
            required: true
            pattern:
              regex: '^\d{1,2}:[0-5]\d$'
              message: Use minutes:seconds, like 0:59
          - name: year
            label: Year
            type: string
            required: true
          - name: added
            label: Date added
            description: The day the reel went on the site. Search engines show it with the video.
            type: date
            required: true
          - name: poster
            label: Poster still
            description: Shown before the muted loop starts. 16:9.
            type: image

      - name: ticker
        label: Scrolling words
        description: The words in the orange-starred banner under the reel.
        type: string
        list: true

      - name: categories
        label: Sections
        description: Each section is a heading and a sideways row of cards. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Section title
            type: string
            required: true
          - name: blurb
            label: One-line description
            type: string
            required: true
          - name: projects
            label: Videos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} · {runtime}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: label
                label: Type
                description: Small text under the title, e.g. Logo sting, Docu-style.
                type: string
                required: true
              - name: thumb
                label: Thumbnail
                description: 16:9 still from the video, 1280×720 JPG.
                type: image
                required: true
              - name: vimeo
                label: Vimeo link
                description: "Vimeo → Share → Copy link. Leave empty to show 'Full video coming soon'."
                type: string
                pattern:
                  regex: '^(https://vimeo\.com/\d+(/[a-f0-9]+)?(\?.*)?)?$'
                  message: Paste the link from Vimeo's Share button, e.g. https://vimeo.com/123456789/abc123def4
              - name: runtime
                label: Runtime
                description: Minutes:seconds, e.g. 1:16
                type: string
                required: true
                pattern:
                  regex: '^\d{1,2}:[0-5]\d$'
                  message: Use minutes:seconds, like 1:16
              - name: added
                label: Date added
                description: The day this video went on the site. Search engines show it with the video.
                type: date
                required: true
              - name: format
                label: Quality
                type: select
                required: true
                options:
                  values: [4K, HD]

  - name: about
    label: About
    description: The About section on the home page — headshot, name, title and your own words.
    type: file
    path: site/content/about.json
    format: json
    fields:
      - name: heading
        label: Heading
        description: The big line at the top of the section, e.g. Behind the edit.
        type: string
        required: true
      - name: body
        label: Paragraphs
        description: Two or three short paragraphs work best. Drag to reorder.
        type: text
        list: true
        required: true
      - name: headshot
        label: Headshot
        description: A portrait photo, 4:5 (e.g. 960×1200 JPG), under ~300 KB.
        type: image
        required: true
      - name: headshotAlt
        label: Headshot description
        description: For screen readers, e.g. Matt Guidry holding a camera on set.
        type: string
      - name: name
        label: Name
        description: Shown under the headshot.
        type: string
        required: true
      - name: title
        label: Title
        description: Shown under the name, e.g. Video Producer & Animator.
        type: string

  - name: terms
    label: Terms of service
    description: The Terms of Service page linked in the footer. The privacy link and contact details at the bottom of the page are added automatically.
    type: file
    path: site/content/terms.json
    format: json
    fields:
      - name: updated
        label: Last updated
        description: Change this whenever you edit the terms. It shows at the top of the page.
        type: date
        required: true
      - name: intro
        label: Intro
        description: The opening paragraph.
        type: text
        required: true
      - name: sections
        label: Sections
        description: Each section is a heading and its text. Leave a blank line between paragraphs. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Text
            type: text
            required: true
